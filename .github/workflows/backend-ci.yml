name: MY TODO CI/CD

on:
  push:
    branches: [ "Backend"]
  pull_request:
    branches: [ "Backend" ]

jobs:
  test:
    name: Тестирование
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo_db_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install pytest pytest-cov

      - name: Запуск тестов
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/todo_db_test
        run: |
          pytest tests/ -v --cov=app --cov-report=term

  lint:
    name: Проверка кода
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка линтеров
        run: |
          pip install flake8
          pip install -r requirements.txt

      - name: Flake8 проверка
        run: |
          flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics
          flake8 tests/ --count --max-line-length=127 --statistics

  build:
    name: Сборка Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/Backend'

    steps:
      - uses: actions/checkout@v4

      - name: Сборка Docker образа
        run: |
          docker build -t my-todo-backend:latest .
          docker images